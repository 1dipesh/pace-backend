services:
  db:
    image: postgres:17
    container_name: pace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pace
      POSTGRES_USER: pace
      POSTGRES_PASSWORD: pace
    ports:
      - "5432:5432"
    volumes:
      - pace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pace -d pace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pace_postgres_data:
